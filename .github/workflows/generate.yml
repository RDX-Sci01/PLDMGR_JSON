- name: Generate payload catalog
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  run: |
    set -euo pipefail
    python3 generate.py

- name: Commit payload catalog
  run: |
    set -euo pipefail

    if git diff --quiet -- payloads.json; then
      echo "payloads.json unchanged"
      exit 0
    fi

    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add payloads.json
    git commit -m "Update payload catalog"
    git push
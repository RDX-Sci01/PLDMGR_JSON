name: Generate payloads.json

on:
  push:
    paths:
      - "links.txt"
  schedule:
    # Every 2 hours — picks up new upstream releases automatically
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and validate payloads.json
        env:
          REPO_DISPLAY_NAME: "RDX Custom Payloads"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads.json
          git diff --cached --quiet && echo "No changes — skipping commit." || (
            git commit -m "chore: update payloads.json [$(date -u +%Y-%m-%dT%H:%M)Z]"
            git push
          )
name: Generate Payload Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "links.txt"
      - "generate.py"
      - ".github/workflows/generate.yml"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: generate-payload-catalog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate payload catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: "Custom Payload Repository"
        run: python3 generate.py

      - name: Commit payload catalog
        run: |
          if [ -z "$(git status --porcelain -- payloads.json icons.json)" ]; then
            echo "payloads.json and icons.json unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add payloads.json icons.json
          git commit -m "Update payload catalog"
          git pull --rebase
          git push

name: Generate payloads.json

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  push:
    paths:
      - "links.txt"          # also runs on every links.txt change
  workflow_dispatch:         # on-demand via Actions tab → Run workflow

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate.py

      - name: Commit payloads.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: refresh payloads.json [skip ci]"
            git push
          fi